repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format --dry-run --Werror
        language: system
        types_or: [c++, c, cuda]
        files: ^(include/|src/|tests/|samples/)
      - id: clang-tidy-naming
        name: clang-tidy naming
        entry: clang-tidy -p build/out/debug --quiet --header-filter=^.*/include/fdtd/.* --warnings-as-errors=readability-identifier-naming
        language: system
        files: ^(src/|tests/|samples/).*\.cpp$
